<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Live Vault | BHAVDROP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #060709; color: #ede8df; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 selection:bg-[#d4af37] selection:text-black">

  <header class="w-full max-w-4xl flex justify-between items-center py-4 border-b border-zinc-900">
    <a href="index.html" class="font-cinzel text-xl font-bold tracking-widest text-white">BHAV<span class="text-[#d4af37]">DROP</span></a>
    <a href="index.html" class="text-xs text-zinc-400 hover:text-white uppercase tracking-wider font-cinzel">← Store Front</a>
  </header>

  <main class="w-full max-w-4xl bg-zinc-950 border border-zinc-800 rounded-3xl p-6 sm:p-10 mt-6 relative shadow-2xl">
    <div class="flex justify-between items-center mb-6">
      <span class="px-3 py-1 bg-red-950/40 border border-red-500/40 text-red-400 text-xs font-mono-num rounded-full flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span> REVERSE COUNTDOWN ACTIVE
      </span>
      <span id="watcher-badge" class="text-xs text-zinc-500 font-mono-num">Synced Realtime</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
      <div class="rounded-2xl overflow-hidden border border-zinc-800 aspect-square">
        <img id="vault-img" src="" class="w-full h-full object-cover">
      </div>

      <div class="space-y-5">
        <div>
          <span class="text-[10px] font-mono-num text-[#d4af37] tracking-widest uppercase">One-Of-One Specimen Drop</span>
          <h1 id="vault-title" class="font-cinzel text-2xl font-bold text-white mt-1"></h1>
          <p id="vault-desc" class="text-xs text-zinc-400 mt-2 leading-relaxed"></p>
        </div>

        <div class="bg-black/90 border border-zinc-800 p-5 rounded-2xl text-center">
          <span class="text-[10px] uppercase font-mono-num text-zinc-500">Live Dropping Bhav</span>
          <div id="vault-price" class="text-5xl font-mono-num font-bold text-[#d4af37] mt-1">₹0</div>
          <div class="flex justify-between text-xs text-zinc-500 font-mono-num mt-3">
            <span id="v-start">Start: ₹0</span>
            <span id="v-step" class="text-rose-400">Decreasing</span>
            <span id="v-floor">Floor: ₹0</span>
          </div>
        </div>

        <div id="action-box">
          <button onclick="claimPiece()" class="w-full py-4 bg-gradient-to-r from-[#d4af37] to-[#aa8323] text-black font-cinzel font-bold text-xs uppercase tracking-widest rounded-xl hover:brightness-110 active:scale-95 transition">
            CAPTURE BHAV AT <span id="btn-price">₹0</span>
          </button>
          <p class="text-[10px] text-center text-zinc-500 font-mono-num mt-2">Capturing reserves this specimen for 180s to complete UPI payment[cite: 6].</p>
        </div>

        <div id="reserved-box" class="hidden bg-zinc-900 border border-[#d4af37] p-5 rounded-xl text-center space-y-3">
          <div class="text-xs font-mono-num text-[#d4af37] font-bold">⚡ BHAV RESERVED: 180s PAYMENT WINDOW[cite: 6]</div>
          <div class="text-2xl font-mono-num font-bold text-white" id="res-price">₹0</div>
          <a href="checkout.html?type=vault" class="block w-full py-3 bg-[#d4af37] text-black font-cinzel font-bold text-xs uppercase rounded-lg">
            Proceed to QR Checkout ➔
          </a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase } from './supabase.js';

    let auction = null;
    let ticker = null;

    async function fetchAuction() {
      const { data, error } = await supabase.from('auctions').select('*').limit(1).single();
      if (error || !data) return;
      auction = data;
      renderBase();
      runPriceLoop();
      listenChanges();
    }

    function renderBase() {
      document.getElementById('vault-title').innerText = auction.title;
      document.getElementById('vault-desc').innerText = auction.description;
      document.getElementById('vault-img').src = auction.image_url;
      document.getElementById('v-start').innerText = `Start: ₹${auction.start_price}`;
      document.getElementById('v-floor').innerText = `Floor: ₹${auction.floor_price}`;
      document.getElementById('v-step').innerText = `-₹${auction.step_amount}/${auction.step_seconds}s`;
    }

    function computeCurrentBhav() {
      const elapsed = Math.max(0, Math.floor((Date.now() - new Date(auction.starts_at).getTime()) / 1000));
      const drops = Math.floor(elapsed / auction.step_seconds) * auction.step_amount;
      return Math.max(auction.floor_price, auction.start_price - drops);
    }

    function runPriceLoop() {
      clearInterval(ticker);
      ticker = setInterval(() => {
        if (auction.status === 'locked') {
          const lockAge = (Date.now() - new Date(auction.locked_at).getTime()) / 1000;
          if (lockAge < 180) {
            document.getElementById('action-box').classList.add('hidden');
            document.getElementById('reserved-box').classList.remove('hidden');
            document.getElementById('res-price').innerText = `₹${auction.locked_price}`;
            return;
          }
        }
        
        document.getElementById('action-box').classList.remove('hidden');
        document.getElementById('reserved-box').classList.add('hidden');
        const p = computeCurrentBhav();
        document.getElementById('vault-price').innerText = `₹${p.toLocaleString('en-IN')}`;
        document.getElementById('btn-price').innerText = `₹${p.toLocaleString('en-IN')}`;
      }, 1000);
    }

    window.claimPiece = async () => {
      const price = computeCurrentBhav();
      const userTag = localStorage.getItem('bd_user_tag') || 'user_' + Math.random().toString(36).substring(2, 8);
      localStorage.setItem('bd_user_tag', userTag);

      const { data, error } = await supabase.rpc('claim_auction_item', {
        target_id: auction.id,
        user_tag: userTag,
        claimed_price: price
      });

      if (error || !data.success) {
        alert(data ? data.message : 'Claim conflict. Try again!');
        return;
      }

      sessionStorage.setItem('bd_vault_order', JSON.stringify({
        auctionId: auction.id,
        title: auction.title,
        price: data.locked_price,
        img: auction.image_url,
        lockedAt: data.locked_at
      }));

      window.location.href = 'checkout.html?type=vault';
    };

    function listenChanges() {
      supabase.channel('public:auctions')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'auctions' }, payload => {
          auction = payload.new;
        })
        .subscribe();
    }

    fetchAuction();
  </script>
</body>
</html>
