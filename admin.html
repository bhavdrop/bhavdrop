<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Suite | BHAVDROP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0c0d0e; color: #ede8df; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="p-6">

  <!-- PIN Modal -->
  <div id="pin-modal" class="fixed inset-0 bg-black flex items-center justify-center p-4 z-50">
    <div class="bg-zinc-950 border border-zinc-800 p-8 rounded-2xl w-full max-w-sm text-center">
      <h2 class="font-cinzel text-xl text-white font-bold mb-2">OWNER SUITE</h2>
      <input type="password" id="pin-input" placeholder="Enter PIN (bhav2026)" class="w-full px-4 py-3 bg-zinc-900 border border-zinc-800 text-center text-xs font-mono-num mb-4 outline-none focus:border-stone-400">
      <button onclick="verifyAccess()" class="w-full py-3 bg-white text-black font-bold text-xs uppercase tracking-wider">Authorize</button>
    </div>
  </div>

  <div id="admin-panel" class="hidden max-w-6xl mx-auto space-y-10">
    <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
      <div>
        <h1 class="font-cinzel text-2xl font-bold text-white">BHAVDROP CONTROL TOWER</h1>
        <p class="text-xs text-zinc-500">Live order queue, inventory adjustments, and auction controller.</p>
      </div>
      <a href="index.html" class="text-xs text-zinc-400 hover:text-white">← Open Store Front</a>
    </div>

    <!-- Product Upload -->
    <section class="bg-zinc-950 border border-zinc-900 p-6 rounded-2xl">
      <h2 class="font-cinzel text-base font-bold text-white mb-4">Upload New Garment to Catalog</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs font-mono-num">
        <div>
          <label class="text-zinc-500">Item ID</label>
          <input type="text" id="p-id" placeholder="e.g. corset-05" class="w-full mt-1 p-2.5 bg-zinc-900 border border-zinc-800">
        </div>
        <div>
          <label class="text-zinc-500">Title</label>
          <input type="text" id="p-title" placeholder="Corset Top" class="w-full mt-1 p-2.5 bg-zinc-900 border border-zinc-800 font-sans">
        </div>
        <div>
          <label class="text-zinc-500">Category</label>
          <select id="p-cat" class="w-full mt-1 p-2.5 bg-zinc-900 border border-zinc-800">
            <option value="her">Her Desire</option>
            <option value="him">His Allure</option>
            <option value="jewels">Heirlooms</option>
          </select>
        </div>
        <div>
          <label class="text-zinc-500">Price (₹)</label>
          <input type="number" id="p-price" placeholder="2499" class="w-full mt-1 p-2.5 bg-zinc-900 border border-zinc-800">
        </div>
        <div>
          <label class="text-zinc-500">Original Price (₹)</label>
          <input type="number" id="p-orig" placeholder="4500" class="w-full mt-1 p-2.5 bg-zinc-900 border border-zinc-800">
        </div>
        <div>
          <label class="text-zinc-500">Image URL</label>
          <input type="text" id="p-img" placeholder="https://..." class="w-full mt-1 p-2.5 bg-zinc-900 border border-zinc-800">
        </div>
      </div>
      <button onclick="saveProduct()" class="mt-4 px-6 py-2.5 bg-white text-black font-bold text-xs uppercase tracking-wider">Publish Garment</button>
    </section>

    <!-- Auction Clock Tuning -->
    <section class="bg-zinc-950 border border-zinc-900 p-6 rounded-2xl">
      <h2 class="font-cinzel text-base font-bold text-white mb-4">Reverse Vault Clock Tuning</h2>
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 text-xs font-mono-num">
        <div>
          <label class="text-zinc-500">Starting Price (₹)</label>
          <input type="number" id="v-start" class="w-full mt-1 p-2.5 bg-zinc-900 border border-zinc-800">
        </div>
        <div>
          <label class="text-zinc-500">Floor Price (₹)</label>
          <input type="number" id="v-floor" class="w-full mt-1 p-2.5 bg-zinc-900 border border-zinc-800">
        </div>
        <div>
          <label class="text-zinc-500">Drop Step (₹)</label>
          <input type="number" id="v-step" class="w-full mt-1 p-2.5 bg-zinc-900 border border-zinc-800">
        </div>
        <div>
          <label class="text-zinc-500">Interval (Seconds)</label>
          <input type="number" id="v-sec" class="w-full mt-1 p-2.5 bg-zinc-900 border border-zinc-800">
        </div>
      </div>
      <button onclick="updateVaultClock()" class="mt-4 px-6 py-2.5 bg-white text-black font-bold text-xs uppercase tracking-wider">Update Live Clock</button>
    </section>

    <!-- Orders Queue -->
    <section class="bg-zinc-950 border border-zinc-900 p-6 rounded-2xl">
      <h2 class="font-cinzel text-base font-bold text-white mb-4">Customer Orders & UTR Verification</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs font-mono-num">
          <thead class="border-b border-zinc-800 text-zinc-500">
            <tr>
              <th class="py-3 px-4">Order ID</th>
              <th class="py-3 px-4">Customer</th>
              <th class="py-3 px-4">Shipping Destination</th>
              <th class="py-3 px-4">Amount</th>
              <th class="py-3 px-4">UTR Ref</th>
              <th class="py-3 px-4">Status</th>
            </tr>
          </thead>
          <tbody id="orders-list"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    window.verifyAccess = () => {
      if (document.getElementById('pin-input').value === 'bhav2026') {
        document.getElementById('pin-modal').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        loadData();
      } else {
        alert('Invalid master PIN.');
      }
    };

    async function loadData() {
      const { data: auc } = await supabase.from('auctions').select('*').limit(1).single();
      if (auc) {
        document.getElementById('v-start').value = auc.start_price;
        document.getElementById('v-floor').value = auc.floor_price;
        document.getElementById('v-step').value = auc.step_amount;
        document.getElementById('v-sec').value = auc.step_seconds;
      }

      const { data: orders } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
      document.getElementById('orders-list').innerHTML = (orders || []).map(o => `
        <tr class="border-b border-zinc-900">
          <td class="py-3 px-4 text-white">${o.id}</td>
          <td class="py-3 px-4">${o.name}<br><span class="text-zinc-500">${o.phone}</span></td>
          <td class="py-3 px-4 text-zinc-400 max-w-xs truncate">${o.address}</td>
          <td class="py-3 px-4 text-white">₹${o.total}</td>
          <td class="py-3 px-4 text-emerald-400 font-bold">${o.upi_ref || 'None'}</td>
          <td class="py-3 px-4 text-stone-400">${o.status}</td>
        </tr>
      `).join('');
    }

    window.saveProduct = async () => {
      const payload = {
        id: document.getElementById('p-id').value.trim() || 'prod-' + Date.now(),
        title: document.getElementById('p-title').value.trim(),
        category: document.getElementById('p-cat').value,
        price: Number(document.getElementById('p-price').value),
        original_price: Number(document.getElementById('p-orig').value) || null,
        images: [document.getElementById('p-img').value.trim()]
      };

      const { error } = await supabase.from('products').insert([payload]);
      if (error) return alert('Failed to publish: ' + error.message);
      alert('✨ Product published to store!');
    };

    window.updateVaultClock = async () => {
      const payload = {
        start_price: Number(document.getElementById('v-start').value),
        floor_price: Number(document.getElementById('v-floor').value),
        step_amount: Number(document.getElementById('v-step').value),
        step_seconds: Number(document.getElementById('v-sec').value),
        starts_at: new Date().toISOString(),
        status: 'live'
      };

      const { error } = await supabase.from('auctions').update(payload).eq('id', 'vault-active');
      if (error) return alert('Failed to update: ' + error.message);
      alert('✨ Live clock updated across all viewers!');
    };
  </script>
</body>
</html>
