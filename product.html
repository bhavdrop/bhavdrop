<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piece Studio | BHAVDROP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #faf8f5; color: #1a1a1a; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="border-b border-[#e8e2d5] h-20 flex items-center justify-between px-6 max-w-7xl mx-auto w-full">
    <a href="index.html" class="font-cinzel text-2xl font-bold tracking-widest">BHAV<span class="text-[#c5a059]">DROP</span></a>
    <a href="collection.html" class="text-xs uppercase tracking-widest text-stone-500 hover:text-black">← Back to Archive</a>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-12 flex-grow w-full">
    <div id="product-container" class="grid grid-cols-1 md:grid-cols-2 gap-12 items-start">
      <!-- Injected by Supabase -->
    </div>
  </main>

  <script src="data.js"></script>
  <script type="module">
    import { supabase } from './supabase.js';

    const pId = new URLSearchParams(window.location.search).get('id');

    async function loadProduct() {
      const { data: item, error } = await supabase.from('products').select('*').eq('id', pId).single();
      if (error || !item) {
        document.getElementById('product-container').innerHTML = `<div class="col-span-full py-16 text-center text-xs">Specimen not found in archive. <a href="collection.html" class="underline">View Catalog</a></div>`;
        return;
      }

      document.getElementById('product-container').innerHTML = `
        <div class="space-y-4">
          <div class="rounded-3xl overflow-hidden border border-[#e8e2d5] bg-stone-100 aspect-[4/5]">
            <img id="main-img" src="${(Array.isArray(item.images) && item.images[0]) || item.image || ''}" class="w-full h-full object-cover">
          </div>
          <div class="flex gap-3">
            ${(Array.isArray(item.images) && item.images.length ? item.images : [item.image].filter(Boolean)).map(img => `
              <img src="${img}" onclick="document.getElementById('main-img').src='${img}'" class="w-16 h-20 rounded-xl object-cover cursor-pointer border border-[#ded7c8] hover:border-[#c5a059]">
            `).join('')}
          </div>
        </div>

        <div class="space-y-6">
          <div>
            <span class="text-[10px] uppercase font-mono-num tracking-widest text-[#8c8270]">${item.category} ATELIER</span>
            <h1 class="font-cinzel text-3xl font-bold mt-1">${item.title}</h1>
            <div class="text-2xl font-mono-num font-bold text-[#c5a059] mt-3">₹${Number(item.price).toLocaleString('en-IN')}</div>
          </div>

          <p class="text-xs text-stone-600 leading-relaxed">${item.description || item.subtitle || ''}</p>

          <div>
            <label class="text-[10px] uppercase font-mono-num text-stone-400">Select Tailoring Size</label>
            <div class="flex flex-wrap gap-2 mt-2" id="size-options">
              ${(item.sizes || ['Standard']).map((s, idx) => `
                <button onclick="selectSize(this, '${s}')" class="size-btn px-4 py-2 border ${idx===0 ? 'border-black bg-black text-white' : 'border-[#ded7c8] bg-white'} rounded-xl text-xs font-mono-num">${s}</button>
              `).join('')}
            </div>
          </div>

          <div class="pt-6 border-t border-[#e8e2d5]">
            <button id="add-btn" class="w-full py-4 bg-[#1a1a1a] hover:bg-[#c5a059] text-white rounded-2xl font-cinzel font-bold text-xs uppercase tracking-widest transition shadow-lg">
              Add To Discreet Bag
            </button>
          </div>
        </div>
      `;

      let selectedSize = item.sizes ? item.sizes[0] : 'Standard';
      window.selectSize = (btn, size) => {
        selectedSize = size;
        document.querySelectorAll('.size-btn').forEach(b => b.className = 'size-btn px-4 py-2 border border-[#ded7c8] bg-white rounded-xl text-xs font-mono-num');
        btn.className = 'size-btn px-4 py-2 border border-black bg-black text-white rounded-xl text-xs font-mono-num';
      };

      document.getElementById('add-btn').onclick = () => addToCart(item, selectedSize);
    }

    loadProduct();
  </script>
</body>
</html>
