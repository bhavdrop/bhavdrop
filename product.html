<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | BHAVDROP</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f5;color:#171717}.font-cinzel{font-family:Cinzel,serif}</style></head><body class="min-h-screen flex flex-col"><header class="border-b border-stone-200 bg-white"><div class="max-w-7xl mx-auto h-20 px-5 flex items-center justify-between"><a href="index.html" class="font-cinzel text-2xl tracking-widest font-bold">BHAV<span class="text-amber-600">DROP</span></a><div class="flex gap-4 text-xs"><a href="collection.html">Shop</a><a href="checkout.html">Bag</a><a href="track.html">Track order</a></div></div></header><main class="max-w-6xl mx-auto px-5 py-10 w-full flex-1"><div id="product-container" class="grid md:grid-cols-2 gap-10"></div><section class="mt-14 border-t border-stone-200 pt-8"><h2 class="font-cinzel text-2xl">Customer reviews</h2><p class="text-sm text-stone-500 mt-2">Reviews are published only after moderation and must be verified against a delivered order.</p><div id="reviews" class="grid md:grid-cols-2 gap-3 mt-5"></div><div class="mt-8 rounded-2xl bg-white border border-stone-200 p-5 max-w-2xl"><h3 class="font-semibold">Write a verified review</h3><form id="review-form" class="grid sm:grid-cols-2 gap-3 mt-4"><input id="rv-order" required placeholder="Order ID (e.g. BD-...)" class="border rounded-lg p-3 text-sm"><input id="rv-last4" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Last 4 digits of order phone" class="border rounded-lg p-3 text-sm"><input id="rv-name" required minlength="2" placeholder="Your name" class="border rounded-lg p-3 text-sm"><select id="rv-rating" class="border rounded-lg p-3 text-sm"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><textarea id="rv-text" required minlength="5" rows="3" placeholder="Share your honest experience" class="sm:col-span-2 border rounded-lg p-3 text-sm"></textarea><button class="sm:col-span-2 rounded-full bg-black text-white p-3 text-xs uppercase tracking-widest">Submit for verification</button><p id="rv-message" class="sm:col-span-2 text-sm" role="status"></p></form></div></section></main><footer class="border-t border-stone-200 bg-white p-8 text-center text-xs text-stone-500"><a href="about.html" class="mx-2">About</a><a href="policies.html" class="mx-2">Policies</a><a href="contact.html" class="mx-2">Contact</a></footer><script src="data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://yrfjqpzqmhddlxbwmsgb.supabase.co','sb_publishable_so1k3P8YeQNeydSvFF9PpQ_vscf0rz9');const id=new URLSearchParams(location.search).get('id');let product;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const {data,error}=await db.from('products').select('*').eq('id',id).maybeSingle();product=data;if(error||!data||data.is_active===false||(data.stock_quantity!=null&&Number(data.stock_quantity)<=0)){document.getElementById('product-container').innerHTML='<div class="md:col-span-2 text-center py-16">This item is unavailable. <a class="underline" href="collection.html">Browse the collection</a></div>';return;}document.title=data.title+' | BHAVDROP';const imgs=[...new Set([...(Array.isArray(data.images)?data.images:[]),data.image].filter(Boolean))];document.getElementById('product-container').innerHTML=`<div><div class="rounded-2xl overflow-hidden bg-stone-100 border border-stone-200"><img id="main-img" src="${esc(imgs[0]||'')}" alt="${esc(data.title)}" class="w-full max-h-[720px] object-contain cursor-zoom-in" title="Click to zoom"></div><div class="flex gap-3 mt-3">${imgs.map((img,i)=>`<button type="button" data-thumb="${i}" class="w-16 h-20 border rounded-lg overflow-hidden"><img src="${esc(img)}" alt="Product view ${i+1}" class="w-full h-full object-cover"></button>`).join('')}</div></div><div class="space-y-5"><p class="text-xs uppercase tracking-widest text-stone-500">${esc(data.category||'collection')}</p><h1 class="font-cinzel text-3xl sm:text-4xl">${esc(data.title)}</h1><p class="text-sm text-stone-500">${esc(data.subtitle||'')}</p><div class="flex items-baseline gap-3"><strong class="text-2xl">₹${Number(data.price).toLocaleString('en-IN')}</strong>${data.original_price&&Number(data.original_price)>Number(data.price)?`<del class="text-stone-400">₹${Number(data.original_price).toLocaleString('en-IN')}</del><span class="text-xs bg-stone-900 text-white rounded-full px-3 py-1">${Math.round((1-Number(data.price)/Number(data.original_price))*100)}% off</span>`:''}</div><p class="text-xs text-stone-500">${data.stock_quantity==null?'Availability confirmed at checkout':Number(data.stock_quantity)>0?'In stock':'Out of stock'}</p><p class="text-sm leading-7 text-stone-600">${esc(data.description||data.subtitle||'')}</p><div><label class="text-xs uppercase tracking-widest">Size</label><div id="size-options" class="flex flex-wrap gap-2 mt-2">${(data.sizes||['Standard']).map((v,i)=>`<button type="button" data-size="${esc(v)}" class="size-btn border rounded-lg px-4 py-2 text-xs ${i===0?'bg-black text-white':'bg-white'}">${esc(v)}</button>`).join('')}</div></div><div><label class="text-xs uppercase tracking-widest">Colour</label><div id="color-options" class="flex flex-wrap gap-2 mt-2">${(data.colors||['Default']).map((v,i)=>`<button type="button" data-color="${esc(v)}" class="color-btn border rounded-lg px-4 py-2 text-xs ${i===0?'bg-black text-white':'bg-white'}">${esc(v)}</button>`).join('')}</div></div><button id="add-btn" class="w-full rounded-full bg-black text-white p-4 text-xs uppercase tracking-widest">Add to bag</button><p class="text-xs text-stone-500">Shipping charges and any discounts are shown before order submission. Guest checkout available.</p></div>`;let size=(data.sizes||['Standard'])[0],color=(data.colors||['Default'])[0];document.querySelectorAll('[data-thumb]').forEach(b=>b.onclick=()=>document.getElementById('main-img').src=imgs[Number(b.dataset.thumb)]);document.getElementById('main-img').onclick=e=>{e.currentTarget.classList.toggle('object-contain');e.currentTarget.classList.toggle('object-cover');e.currentTarget.classList.toggle('max-h-[720px]')};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('bg-black',x===b));document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('text-white',x===b))});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('bg-black',x===b));document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('text-white',x===b))});document.getElementById('add-btn').onclick=()=>{addToCart(data,size,color);window.bdTrack?.('add_to_cart',data.id)};window.bdTrack?.('product_view',data.id);await loadReviews()}
async function loadReviews(){const {data}=await db.from('product_reviews').select('customer_name,rating,review_text,created_at').eq('product_id',String(id)).eq('status','approved').order('created_at',{ascending:false});const root=document.getElementById('reviews');if(!data?.length){root.innerHTML='<p class="text-sm text-stone-500">No published reviews yet.</p>';return;}root.innerHTML=data.map(r=>`<article class="rounded-xl bg-white border border-stone-200 p-4"><div class="font-semibold">${esc(r.customer_name)}</div><div class="text-amber-600">${'★'.repeat(Number(r.rating))}${'☆'.repeat(5-Number(r.rating))}</div><p class="text-sm text-stone-600 mt-2">${esc(r.review_text)}</p></article>`).join('')}
document.getElementById('review-form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('rv-message');msg.textContent='Submitting for verification…';const {error}=await db.rpc('submit_product_review',{p_order_id:document.getElementById('rv-order').value.trim(),p_phone_last4:document.getElementById('rv-last4').value,p_product_id:String(id),p_customer_name:document.getElementById('rv-name').value.trim(),p_rating:Number(document.getElementById('rv-rating').value),p_review_text:document.getElementById('rv-text').value.trim()});msg.textContent=error?'Could not submit: '+error.message:'Review submitted. It will appear after moderation.';if(!error)e.target.reset()};load().catch(e=>{document.getElementById('product-container').textContent='Could not load product. Please try again.';console.error(e)});</script><script src="site-control.js"></script><script src="analytics.js"></script><script src="support-widget.js"></script><script src="mobile-nav.js"></script>
</body></html>
