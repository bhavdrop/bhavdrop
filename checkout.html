<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | BHAVDROP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Cinzel:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #111111; }
    .font-serif-luxury { font-family: 'Playfair Display', serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex items-center justify-center bg-stone-50">

  <div class="w-full max-w-xl bg-white border border-stone-300 p-6 sm:p-10 shadow-sm">
    <div class="flex justify-between items-center border-b border-stone-200 pb-4">
      <div>
        <h1 class="font-cinzel text-xl font-bold tracking-wider">DISCREET CHECKOUT</h1>
        <p class="text-[11px] text-stone-500 uppercase tracking-widest">Unmarked Luxury Parcel</p>
      </div>
      <a href="index.html" class="text-xs font-bold uppercase tracking-wider text-stone-400 hover:text-black">Cancel</a>
    </div>

    <!-- Items In Order -->
    <div id="checkout-items" class="py-4 space-y-3 border-b border-stone-200 max-h-52 overflow-y-auto"></div>

    <!-- Calculation Breakdown -->
    <div class="py-4 space-y-2 border-b border-stone-200 text-xs font-medium">
      <div class="flex justify-between text-stone-500">
        <span>Delivery Courier:</span>
        <span id="co-shipping" class="font-mono-num text-black">₹70</span>
      </div>
      <div class="flex justify-between text-base font-bold text-stone-900 pt-2 border-t border-stone-100">
        <span>Total Payable:</span>
        <span id="co-total" class="font-mono-num text-stone-900">₹0</span>
      </div>
    </div>

    <!-- Delivery Form -->
    <form onsubmit="initiatePayment(event)" class="mt-6 space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <input type="text" id="cust-name" required placeholder="Full Name" class="px-3 py-2.5 bg-stone-50 border border-stone-300 text-xs outline-none focus:border-black">
        <input type="tel" id="cust-phone" required placeholder="WhatsApp Number" class="px-3 py-2.5 bg-stone-50 border border-stone-300 text-xs outline-none focus:border-black">
      </div>
      <textarea id="cust-address" required placeholder="Complete Shipping Address (Flat, Street, Landmark, PIN Code)" rows="2" class="w-full px-3 py-2.5 bg-stone-50 border border-stone-300 text-xs outline-none focus:border-black"></textarea>
      
      <button type="submit" class="w-full py-4 bg-black hover:bg-stone-800 text-white font-bold text-xs uppercase tracking-widest transition">
        Pay via Instant UPI QR
      </button>
    </form>
  </div>

  <!-- QR Modal with 3-Minute Clock -->
  <div id="payment-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-stone-300 p-6 sm:p-8 w-full max-w-sm text-center">
      <div class="text-rose-600 font-mono-num text-sm font-bold mb-1">
        TIME REMAINING: <span id="timer-label">03:00</span>
      </div>
      <p class="text-[10px] text-stone-500 mb-3">Scan using GPay, PhonePe, or Paytm</p>

      <div class="p-3 bg-stone-50 border border-stone-200 inline-block">
        <img id="qr-image" src="" alt="UPI QR" class="w-48 h-48 mx-auto">
      </div>

      <div class="text-xs font-mono-num font-bold text-stone-900 mt-2">
        Payable Amount: ₹<span id="qr-total-label">0</span>
      </div>

      <div class="mt-4 text-left space-y-2">
        <label class="text-[10px] font-mono-num uppercase text-stone-500">12-Digit UPI Transaction / UTR No.</label>
        <input type="text" id="utr-ref" placeholder="e.g. 439021984210" class="w-full px-3 py-2 bg-stone-50 border border-stone-300 text-xs font-mono-num outline-none focus:border-black">
        <button onclick="confirmPayment()" class="w-full py-3 bg-black text-white font-bold text-xs uppercase tracking-wider hover:bg-stone-800 transition">
          I Have Made The Payment
        </button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script type="module">
    import { supabase } from './supabase.js';

    const isVault = new URLSearchParams(window.location.search).get('type') === 'vault';
    let items = [];
    let grandTotal = 0;
    let timer = null;
    let timeLeft = 180;

    function renderCheckout() {
      if (isVault) {
        const v = JSON.parse(sessionStorage.getItem('bd_vault_order'));
        if (v) items.push(v);
      } else {
        items = getCart();
      }

      const container = document.getElementById('checkout-items');
      if (items.length === 0) {
        container.innerHTML = '<div class="text-center py-4 text-xs text-stone-400">Your bag is empty.</div>';
        return;
      }

      const subtotal = items.reduce((sum, i) => sum + (Number(i.price) * (i.qty || 1)), 0);
      const shipping = isVault || subtotal > 1499 ? 0 : 70;
      grandTotal = subtotal + shipping;

      document.getElementById('co-shipping').innerText = shipping === 0 ? 'FREE' : '₹70';
      document.getElementById('co-total').innerText = `₹${grandTotal.toLocaleString('en-IN')}`;

      container.innerHTML = items.map(i => `
        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center gap-3">
            <img src="${i.img}" class="w-10 h-10 object-cover border border-stone-200">
            <div>
              <div class="font-semibold text-stone-900">${i.title}</div>
              <div class="text-[10px] text-stone-400">${i.size || 'Standard'} x ${i.qty || 1}</div>
            </div>
          </div>
          <span class="font-mono-num font-bold">₹${Number(i.price).toLocaleString('en-IN')}</span>
        </div>
      `).join('');
    }

    window.initiatePayment = (e) => {
      e.preventDefault();
      if (items.length === 0) return alert('Your bag is empty.');

      const upiId = 'bhavdrop@okaxis'; // Set your merchant UPI ID
      const upiLink = `upi://pay?pa=${upiId}&pn=BhavDrop&am=${grandTotal}&cu=INR`;
      document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiLink)}`;
      document.getElementById('qr-total-label').innerText = grandTotal.toLocaleString('en-IN');
      document.getElementById('payment-modal').classList.remove('hidden');

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const secs = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('timer-label').innerText = `${mins}:${secs}`;

        if (timeLeft <= 0) {
          clearInterval(timer);
          alert('180-second reservation expired!');
          window.location.href = isVault ? 'vault.html' : 'index.html';
        }
      }, 1000);
    };

    window.confirmPayment = async () => {
      const utr = document.getElementById('utr-ref').value.trim();
      if (utr.length < 8) return alert('Please enter a valid 12-digit transaction UTR number.');

      const orderId = 'BD-' + Math.floor(100000 + Math.random() * 900000);
      const payload = {
        id: orderId,
        name: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value,
        address: document.getElementById('cust-address').value,
        items: items,
        total: grandTotal,
        status: 'PAID / DISCREET DISPATCH QUEUE',
        upi_ref: utr
      };

      const { error } = await supabase.from('orders').insert([payload]);
      if (error) return alert('Failed to log order: ' + error.message);

      if (isVault) {
        await supabase.from('auctions').update({ status: 'sold', upi_ref_id: utr }).eq('id', items[0].auctionId);
        sessionStorage.removeItem('bd_vault_order');
      } else {
        localStorage.removeItem('bd_cart');
      }

      alert(`✨ Order ${orderId} placed successfully!`);
      window.location.href = `track.html?orderId=${orderId}`;
    };

    renderCheckout();
  </script>
</body>
</html>
