<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discreet Checkout | BHAVDROP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #faf8f5; color: #1a1a1a; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-center">

  <div class="w-full max-w-lg bg-white border border-[#ded7c8] rounded-3xl p-6 sm:p-8 shadow-xl">
    <div class="flex justify-between items-center pb-4 border-b border-[#e8e2d5]">
      <div>
        <h1 class="font-cinzel text-xl font-bold">DISCREET CHECKOUT</h1>
        <p class="text-[11px] text-stone-500">Unmarked matte-black packaging guaranteed[cite: 2].</p>
      </div>
      <a href="index.html" class="text-xs text-stone-400 hover:text-black">Cancel[cite: 2]</a>
    </div>

    <div id="items-list" class="py-4 space-y-3 border-b border-[#e8e2d5] max-h-48 overflow-y-auto"></div>

    <div class="py-4 space-y-2 border-b border-[#e8e2d5] text-xs">
      <div class="flex justify-between text-stone-500">
        <span>Delivery Courier:</span>
        <span id="ship-cost" class="font-mono-num text-black">₹70</span>
      </div>
      <div class="flex justify-between text-base font-bold text-stone-900 pt-2 border-t border-stone-100">
        <span>Total Payable:</span>
        <span id="final-amt" class="font-mono-num text-[#c5a059]">₹0</span>
      </div>
    </div>

    <form onsubmit="handleCheckout(event)" class="mt-4 space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="cust-name" required placeholder="Full Name" class="px-3 py-2.5 bg-stone-50 border border-[#ded7c8] rounded-xl text-xs outline-none focus:border-black">
        <input type="tel" id="cust-phone" required placeholder="WhatsApp Number" class="px-3 py-2.5 bg-stone-50 border border-[#ded7c8] rounded-xl text-xs outline-none focus:border-black">
      </div>
      <textarea id="cust-address" required placeholder="Delivery Street Address & City" rows="2" class="w-full px-3 py-2.5 bg-stone-50 border border-[#ded7c8] rounded-xl text-xs outline-none focus:border-black"></textarea>
      
      <button type="submit" class="w-full py-4 bg-[#1a1a1a] hover:bg-[#c5a059] text-white font-cinzel font-bold text-xs uppercase tracking-widest rounded-xl transition shadow-lg">
        Generate Dynamic UPI QR
      </button>
    </form>
  </div>

  <!-- QR Modal with 3-Minute Timer -->
  <div id="qr-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-[#ded7c8] p-6 rounded-3xl w-full max-w-sm text-center">
      <div class="text-rose-600 font-mono-num text-sm font-bold mb-1">
        TIME REMAINING: <span id="timer-display">03:00</span>
      </div>
      <p class="text-[10px] text-stone-500 mb-3">Scan via Google Pay, PhonePe, or Paytm</p>

      <div class="bg-stone-50 p-3 rounded-2xl inline-block border border-stone-200">
        <img id="qr-code-img" src="" class="w-48 h-48 mx-auto">
      </div>

      <div class="text-xs font-mono-num font-bold text-stone-900 mt-2">
        Amount: ₹<span id="qr-amt-label">0</span>
      </div>

      <div class="mt-4 text-left">
        <label class="text-[10px] font-mono-num text-stone-500 uppercase">Enter 12-Digit UPI Transaction / UTR Ref</label>
        <input type="text" id="utr-ref" placeholder="e.g. 439021984210" class="w-full mt-1 px-3 py-2 bg-stone-50 border border-[#ded7c8] rounded-xl text-xs font-mono-num outline-none focus:border-black">
        <button onclick="submitOrder()" class="w-full mt-3 py-3 bg-[#c5a059] hover:bg-black text-white font-cinzel font-bold text-xs uppercase tracking-wider rounded-xl transition">
          I Have Made The Payment
        </button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script type="module">
    import { supabase } from './supabase.js';

    const isVault = new URLSearchParams(window.location.search).get('type') === 'vault';[cite: 2]
    let items = [];
    let grandTotal = 0;
    let timer = null;
    let secondsLeft = 180;

    function renderOrder() {
      if (isVault) {
        const v = JSON.parse(sessionStorage.getItem('bd_vault_order'));
        if (v) items.push(v);
      } else {
        items = getCart();[cite: 2]
      }

      const container = document.getElementById('items-list');
      if (items.length === 0) {
        container.innerHTML = '<div class="text-center text-xs py-4 text-stone-400">Bag is empty.</div>';[cite: 2]
        return;
      }

      const subtotal = items.reduce((sum, i) => sum + (Number(i.price) * (i.qty || 1)), 0);[cite: 2]
      const shipping = isVault || subtotal > 1499 ? 0 : 70;[cite: 2]
      grandTotal = subtotal + shipping;

      document.getElementById('ship-cost').innerText = shipping === 0 ? 'FREE' : '₹70';[cite: 2]
      document.getElementById('final-amt').innerText = `₹${grandTotal.toLocaleString('en-IN')}`;[cite: 2]

      container.innerHTML = items.map(i => `
        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center gap-3">
            <img src="${i.img}" class="w-10 h-10 object-cover rounded-lg">
            <div>
              <div class="font-semibold">${i.title}</div>
              <div class="text-[10px] text-stone-400">${i.size || 'Standard'} x ${i.qty || 1}</div>
            </div>
          </div>
          <span class="font-mono-num font-bold">₹${Number(i.price).toLocaleString('en-IN')}</span>
        </div>
      `).join('');[cite: 2]
    }

    window.handleCheckout = (e) => {
      e.preventDefault();
      if (items.length === 0) return alert('Your bag is empty.');[cite: 2]

      const upiId = 'bhavdrop@okaxis'; // Update with your merchant UPI ID
      const upiDeepLink = `upi://pay?pa=${upiId}&pn=BhavDrop&am=${grandTotal}&cu=INR`;
      document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(upiDeepLink)}`;
      document.getElementById('qr-amt-label').innerText = grandTotal.toLocaleString('en-IN');
      document.getElementById('qr-modal').classList.remove('hidden');

      // Start 3-minute payment countdown
      clearInterval(timer);
      timer = setInterval(() => {
        secondsLeft--;
        const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const secs = String(secondsLeft % 60).padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;

        if (secondsLeft <= 0) {
          clearInterval(timer);
          alert('180-second reservation hold expired!');
          window.location.href = isVault ? 'vault.html' : 'index.html';
        }
      }, 1000);
    };

    window.submitOrder = async () => {
      const utr = document.getElementById('utr-ref').value.trim();
      if (utr.length < 8) return alert('Please enter a valid 12-digit transaction number.');

      const orderId = 'BD-' + Math.floor(100000 + Math.random() * 900000);[cite: 2]
      const orderPayload = {
        id: orderId,
        name: document.getElementById('cust-name').value,[cite: 2]
        phone: document.getElementById('cust-phone').value,[cite: 2]
        address: document.getElementById('cust-address').value,
        items: items,[cite: 2]
        total: grandTotal,[cite: 2]
        status: 'PAID / DISCREET DISPATCH QUEUE',[cite: 2]
        upi_ref: utr
      };

      const { error } = await supabase.from('orders').insert([orderPayload]);
      if (error) return alert('Failed to log order. Please verify connectivity.');

      if (isVault) {
        await supabase.from('auctions').update({ status: 'sold', upi_ref_id: utr }).eq('id', items[0].auctionId);
        sessionStorage.removeItem('bd_vault_order');
      } else {
        localStorage.removeItem('bd_cart');
      }

      alert(`✨ Order ${orderId} registered successfully!`);
      window.location.href = `track.html?orderId=${orderId}`;[cite: 2]
    };

    renderOrder();
  </script>
</body>
</html>
