<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Checkout | BHAVDROP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif-title { font-family: 'Cinzel', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#050608] text-zinc-100 min-h-screen p-4 flex justify-center items-center selection:bg-[#d4af37] selection:text-black">

  <div class="w-full max-w-lg bg-zinc-950 border border-zinc-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
    
    <div class="flex justify-between items-center pb-4 border-b border-zinc-900">
      <div>
        <h1 class="font-serif-title text-xl font-bold text-[#d4af37]">DISCREET CHECKOUT</h1>
        <p class="text-[11px] text-zinc-500">Unmarked matte black packaging guaranteed.</p>
      </div>
      <a href="index.html" class="text-xs text-zinc-500 hover:text-white transition">Cancel</a>
    </div>

    <!-- Order Items Breakdown -->
    <div id="checkout-items" class="py-4 space-y-3 border-b border-zinc-900 max-h-48 overflow-y-auto">
      <!-- Injected by JS -->
    </div>

    <!-- Totals & Coupon -->
    <div class="py-4 space-y-2 border-b border-zinc-900 text-xs">
      <div class="flex justify-between text-zinc-400">
        <span>Order Subtotal:</span>
        <span id="co-subtotal" class="font-mono-num text-white">₹0</span>
      </div>
      <div class="flex justify-between text-zinc-400">
        <span>Express Delivery:</span>
        <span id="co-shipping" class="font-mono-num text-white">₹70</span>
      </div>
      <div id="discount-row" class="hidden flex justify-between text-emerald-400">
        <span>Privilege Discount:</span>
        <span id="co-discount" class="font-mono-num">-₹0</span>
      </div>
      <div class="flex justify-between text-sm font-bold text-white pt-2 border-t border-zinc-900">
        <span>Total Payable:</span>
        <span id="co-total" class="font-mono-num text-base text-[#d4af37]">₹0</span>
      </div>

      <!-- Coupon Input -->
      <div class="flex gap-2 pt-2">
        <input type="text" id="coupon-code" placeholder="Privilege Code (try LUSTVIP)" class="flex-grow px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-xl text-xs uppercase outline-none focus:border-[#d4af37]">
        <button onclick="applyCoupon()" class="px-4 py-2 bg-zinc-800 hover:bg-[#d4af37] hover:text-black rounded-xl text-xs font-bold transition">Apply</button>
      </div>
    </div>

    <!-- Shipping Form -->
    <form onsubmit="initiateUPI(event)" class="mt-4 space-y-3">
      <h3 class="text-xs font-mono-num uppercase tracking-wider text-zinc-400">Delivery Address</h3>
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="cust-name" required placeholder="Full Name" class="px-3 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-xs text-white outline-none focus:border-[#d4af37]">
        <input type="tel" id="cust-phone" required placeholder="WhatsApp Number" class="px-3 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-xs text-white outline-none focus:border-[#d4af37]">
      </div>
      <textarea id="cust-address" required placeholder="House / Flat No., Street, Landmark" rows="2" class="w-full px-3 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-xs text-white outline-none focus:border-[#d4af37]"></textarea>
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="cust-city" required placeholder="City" class="px-3 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-xs text-white outline-none focus:border-[#d4af37]">
        <input type="text" id="cust-pincode" required placeholder="PIN Code" class="px-3 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-xs text-white outline-none focus:border-[#d4af37]">
      </div>

      <button type="submit" class="w-full py-4 bg-gradient-to-r from-[#d4af37] to-[#f3e5ab] text-black font-serif-title font-bold text-sm rounded-xl transition hover:brightness-110 shadow-lg shadow-[#d4af37]/20">
        CONFIRM & PAY VIA UPI
      </button>
    </form>

    <!-- Simulated UPI Modal -->
    <div id="upi-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
      <div class="bg-zinc-950 border border-[#d4af37]/40 p-6 rounded-3xl w-full max-w-sm text-center">
        <div class="w-10 h-10 rounded-full bg-[#d4af37]/20 text-[#d4af37] flex items-center justify-center mx-auto mb-3">⚡</div>
        <h3 class="font-serif-title text-base font-bold text-white">Select UPI Provider</h3>
        <p class="text-xs text-zinc-400 mt-1">Approve payment of <strong id="upi-pay-amount" class="text-[#d4af37] font-mono-num"></strong></p>

        <div class="grid grid-cols-3 gap-2 my-5">
          <button onclick="finalizePayment('Google Pay')" class="p-3 bg-zinc-900 border border-zinc-800 hover:border-[#d4af37] rounded-xl text-xs font-semibold">GPay</button>
          <button onclick="finalizePayment('PhonePe')" class="p-3 bg-zinc-900 border border-zinc-800 hover:border-[#d4af37] rounded-xl text-xs font-semibold">PhonePe</button>
          <button onclick="finalizePayment('Paytm')" class="p-3 bg-zinc-900 border border-zinc-800 hover:border-[#d4af37] rounded-xl text-xs font-semibold">Paytm</button>
        </div>

        <button onclick="document.getElementById('upi-modal').classList.add('hidden')" class="text-xs text-zinc-500 hover:text-white">Cancel</button>
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script>
    const isVault = new URLSearchParams(window.location.search).get('type') === 'vault';
    let subtotal = 0;
    let shipping = 70;
    let discount = 0;
    let items = [];

    function renderCheckout() {
      const container = document.getElementById('checkout-items');
      if (isVault) {
        const v = JSON.parse(sessionStorage.getItem('bd_vault_order'));
        if (v) items.push(v);
      } else {
        items = getCart();
      }

      if (items.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-xs text-zinc-500">Your bag is empty. <a href="index.html" class="text-[#d4af37]">Shop Store</a></div>';
        return;
      }

      subtotal = items.reduce((sum, item) => sum + Number(item.price), 0);
      shipping = subtotal > 1499 || isVault ? 0 : 70;

      container.innerHTML = items.map(item => `
        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center gap-3">
            <img src="${item.img}" class="w-10 h-10 object-cover rounded-lg border border-zinc-800">
            <div>
              <div class="font-semibold text-white">${item.title}</div>
              <div class="text-[10px] text-zinc-500">${item.size || ''} ${item.finish ? '• ' + item.finish : ''}</div>
            </div>
          </div>
          <span class="font-mono-num text-[#d4af37]">₹${item.price}</span>
        </div>
      `).join('');

      updateTotals();
    }

    function updateTotals() {
      const grandTotal = Math.max(0, subtotal + shipping - discount);
      document.getElementById('co-subtotal').innerText = `₹${subtotal}`;
      document.getElementById('co-shipping').innerText = shipping === 0 ? 'FREE' : `₹${shipping}`;
      document.getElementById('co-total').innerText = `₹${grandTotal}`;
      document.getElementById('upi-pay-amount').innerText = `₹${grandTotal}`;
    }

    function applyCoupon() {
      const code = document.getElementById('coupon-code').value.trim().toUpperCase();
      if (code === 'LUSTVIP') {
        discount = Math.round(subtotal * 0.15);
        document.getElementById('discount-row').classList.remove('hidden');
        document.getElementById('co-discount').innerText = `-₹${discount}`;
        alert('✨ 15% VIP Privilege applied!');
      } else if (code === 'FREESHIP') {
        shipping = 0;
        alert('✨ Free Express Delivery applied!');
      } else {
        alert('Invalid or expired coupon code.');
      }
      updateTotals();
    }

    function initiateUPI(e) {
      e.preventDefault();
      if (items.length === 0) return alert('Bag is empty!');
      document.getElementById('upi-modal').classList.remove('hidden');
    }

    function finalizePayment(method) {
      const grandTotal = Math.max(0, subtotal + shipping - discount);
      const newOrder = {
        id: 'BD-' + Math.floor(100000 + Math.random() * 900000),
        name: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value,
        address: `${document.getElementById('cust-address').value}, ${document.getElementById('cust-city').value} - ${document.getElementById('cust-pincode').value}`,
        items: items,
        total: grandTotal,
        method: method,
        status: 'PAID / DISCREET DISPATCH QUEUE',
        date: new Date().toLocaleDateString('en-IN')
      };

      const orders = JSON.parse(localStorage.getItem('bd_orders') || '[]');
      orders.unshift(newOrder);
      localStorage.setItem('bd_orders', JSON.stringify(orders));

      // Clear bag
      if (!isVault) localStorage.setItem('bd_cart', JSON.stringify([]));

      alert(`✨ Order ${newOrder.id} Placed Successfully via ${method}!\nTracking number generated.`);
      window.location.href = `track.html?orderId=${newOrder.id}`;
    }

    renderCheckout();
  </script>
</body>
</html>
