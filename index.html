<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BhavDrop | Curated Streetwear & Live Sunday Vault</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Space Grotesk', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-black">

  <!-- Top Micro Bar -->

    🔥 NEXT LIVE VAULT DROP: THIS SUNDAY @ 8:00 PM IST • FLAT ₹70 EXPRESS ALL-INDIA DELIVERY
  </div>

  <!-- Navbar -->
  <header class="sticky top-0 z-40 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="#" class="flex items-center gap-2 group">
        <span class="text-2xl sm:text-3xl font-extrabold tracking-tighter text-white font-heading group-hover:text-emerald-400 transition">
          BHAV<span class="text-emerald-400">DROP</span>

      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-zinc-300">

        </a>
        <a href="#store-section" class="hover:text-emerald-400 transition">Everyday Store</a>
        <a href="#referral-section" class="hover:text-emerald-400 transition">Free Delivery Club</a>
        <a href="#how-it-works" class="hover:text-emerald-400 transition">How Drops Work</a>
      </nav>

      <!-- Search & Cart -->
      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center bg-zinc-900 border border-zinc-800 rounded-full px-3 py-1.5 text-xs text-zinc-400 w-48 lg:w-64">
          <svg class="w-4 h-4 mr-2 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" placeholder="Search hoodies, tees, cargos..." class="bg-transparent border-none outline-none w-full text-white placeholder-zinc-500">

          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-emerald-500 text-black font-extrabold text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>

    </div>
  </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">
      
      <div>

          India's 1st Falling-Price Drop Platform
        </div>
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-[1.1] text-white">

        </h1>
        <p class="mt-5 text-base sm:text-lg text-zinc-400 max-w-xl">
          Shop everyday staples
