<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Shipment | BHAVDROP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #faf8f5; color: #1a1a1a; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center">

  <div class="w-full max-w-md bg-white border border-[#ded7c8] rounded-3xl p-6 sm:p-8 shadow-xl">
    <div class="text-center mb-6">
      <h1 class="font-cinzel text-xl font-bold">DISCREET PARCEL TRACKING[cite: 5]</h1>
      <p class="text-xs text-stone-500 mt-1">Real-time express dispatch lookup across India[cite: 5]</p>
    </div>

    <div class="flex gap-2 mb-6">
      <input type="text" id="track-id" placeholder="Enter Order ID (e.g. BD-892412)" class="flex-grow px-4 py-3 bg-stone-50 border border-[#ded7c8] rounded-xl text-xs font-mono-num uppercase outline-none focus:border-black">[cite: 5]
      <button onclick="lookupOrder()" class="px-5 py-3 bg-[#1a1a1a] hover:bg-[#c5a059] text-white font-cinzel font-bold text-xs uppercase rounded-xl transition">Track[cite: 5]</button>
    </div>

    <div id="track-result" class="hidden bg-stone-50 border border-[#ded7c8] rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-stone-200 pb-3">
        <div>
          <span class="text-[10px] font-mono-num text-stone-400 uppercase">Waybill Ref[cite: 5]</span>
          <div id="res-id" class="text-sm font-bold font-mono-num text-[#c5a059]"></div>
        </div>
        <div id="res-status" class="px-2.5 py-1 bg-emerald-500/10 border border-emerald-500/30 text-emerald-700 text-[10px] font-mono-num rounded-full font-bold"></div>
      </div>

      <div class="space-y-3 text-xs">
        <div class="flex items-center gap-3">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span class="font-medium text-stone-800">Payment Verified & Discreetly Boxed[cite: 5]</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
          <span class="text-stone-600">Dispatched via Express Courier (Delhivery / Blue Dart)</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    window.lookupOrder = async () => {
      const id = document.getElementById('track-id').value.trim().toUpperCase();
      if (!id) return;

      const { data, error } = await supabase.from('orders').select('*').eq('id', id).single();
      if (error || !data) return alert('Order ID not found.');

      document.getElementById('res-id').innerText = data.id;
      document.getElementById('res-status').innerText = data.status;
      document.getElementById('track-result').classList.remove('hidden');
    };

    const urlRef = new URLSearchParams(window.location.search).get('orderId');
    if (urlRef) {
      document.getElementById('track-id').value = urlRef;
      window.lookupOrder();
    }
  </script>
</body>
</html>
