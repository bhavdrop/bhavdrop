<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Discreet Parcel | BHAVDROP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Cinzel:wght@700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #111111; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center bg-stone-50">

  <div class="w-full max-w-md bg-white border border-stone-300 p-8 shadow-sm">
    <div class="text-center mb-6">
      <h1 class="font-cinzel text-xl font-bold">DISCREET PARCEL TRACKING</h1>
      <p class="text-xs text-stone-500 mt-1">Real-time express dispatch lookup across India</p>
    </div>

    <div class="flex gap-2 mb-6">
      <input type="text" id="track-input" placeholder="e.g. BD-892412" class="flex-grow px-4 py-3 bg-stone-50 border border-stone-300 text-xs font-mono-num uppercase outline-none focus:border-black">
      <button onclick="searchOrder()" class="px-5 py-3 bg-black hover:bg-stone-800 text-white font-bold text-xs uppercase tracking-wider transition">Track</button>
    </div>

    <div id="track-result" class="hidden bg-stone-50 border border-stone-200 p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-stone-200 pb-3">
        <div>
          <span class="text-[10px] font-mono-num text-stone-400 uppercase">Waybill ID</span>
          <div id="res-id" class="text-sm font-bold font-mono-num text-stone-900"></div>
        </div>
        <div id="res-status" class="px-2.5 py-1 bg-emerald-500/10 text-emerald-700 text-[10px] font-mono-num font-bold"></div>
      </div>

      <div class="space-y-3 text-xs">
        <div class="flex items-center gap-3">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span class="font-medium text-stone-800">Payment Verified & Discreetly Boxed</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="w-2.5 h-2.5 rounded-full bg-stone-400 animate-pulse"></span>
          <span class="text-stone-500">Logistics Dispatch (Blue Dart / Delhivery Express)</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    window.searchOrder = async () => {
      const id = document.getElementById('track-input').value.trim().toUpperCase();
      if (!id) return;

      const { data, error } = await supabase.from('orders').select('*').eq('id', id).single();
      if (error || !data) return alert('Order ID not found.');

      document.getElementById('res-id').innerText = data.id;
      document.getElementById('res-status').innerText = data.status;
      document.getElementById('track-result').classList.remove('hidden');
    };

    const ref = new URLSearchParams(window.location.search).get('orderId');
    if (ref) {
      document.getElementById('track-input').value = ref;
      window.searchOrder();
    }
  </script>
</body>
</html>
