<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Discreet Parcel | BHAVDROP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Cinzel:wght@700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #111111; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center bg-stone-50">

  <div class="w-full max-w-md bg-white border border-stone-300 p-8 shadow-sm">
    <div class="text-center mb-6">
      <h1 class="font-cinzel text-xl font-bold">DISCREET PARCEL TRACKING</h1>
      <p class="text-xs text-stone-500 mt-1">Real-time express dispatch lookup across India</p>
    </div>

    <div class="space-y-2 mb-6">
      <input type="text" id="track-input" placeholder="Order ID (e.g. BD-ABC123)" autocomplete="off" class="w-full px-4 py-3 bg-stone-50 border border-stone-300 text-xs font-mono-num uppercase outline-none focus:border-black">
      <input type="tel" id="track-phone" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="Last 4 digits of order phone number" class="w-full px-4 py-3 bg-stone-50 border border-stone-300 text-xs outline-none focus:border-black">
      <button onclick="searchOrder()" class="w-full px-5 py-3 bg-black hover:bg-stone-800 text-white font-bold text-xs uppercase tracking-wider transition">Track Parcel</button>
      <p id="track-message" class="text-xs text-rose-700" role="status"></p>
    </div>

    <div id="track-result" class="hidden bg-stone-50 border border-stone-200 p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-stone-200 pb-3">
        <div>
          <span class="text-[10px] font-mono-num text-stone-400 uppercase">Waybill ID</span>
          <div id="res-id" class="text-sm font-bold font-mono-num text-stone-900"></div>
        </div>
        <div id="res-status" class="px-2.5 py-1 bg-emerald-500/10 text-emerald-700 text-[10px] font-mono-num font-bold"></div>
      </div>

      <div class="space-y-3 text-xs">
        <div class="flex items-center gap-3">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span class="font-medium text-stone-800">Order received — awaiting next update</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="w-2.5 h-2.5 rounded-full bg-stone-400 animate-pulse"></span>
          <span class="text-stone-500">Dispatch details will appear after the order is processed</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    window.searchOrder = async () => {
      const id = document.getElementById('track-input').value.trim().toUpperCase();
      const phoneLast4 = document.getElementById('track-phone').value.trim();
      const message = document.getElementById('track-message');
      const result = document.getElementById('track-result');
      result.classList.add('hidden');
      message.textContent = '';
      if (!id || !/^\d{4}$/.test(phoneLast4)) {
        message.textContent = 'Enter the order ID and the last 4 digits of the phone number used for the order.';
        return;
      }
      const { data, error } = await supabase.rpc('track_order', { p_order_id: id, p_phone_last4: phoneLast4 });
      if (error || !data || data.found !== true) {
        message.textContent = error ? 'Tracking is not configured yet. Ask the site owner to apply the database setup SQL.' : 'No matching order found. Check the order ID and phone digits.';
        return;
      }
      document.getElementById('res-id').textContent = data.id;
      document.getElementById('res-status').textContent = data.status || 'PROCESSING';
      document.getElementById('track-result').classList.remove('hidden');
    };

    const ref = new URLSearchParams(window.location.search).get('orderId');
    if (ref) {
      document.getElementById('track-input').value = ref;
      // Phone verification is required; do not auto-query or reveal order status from the URL alone.
    }
  </script>
</body>
</html>
