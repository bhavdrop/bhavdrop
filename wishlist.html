<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | BHAVDROP</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f5;color:#171717}.brand{font-family:Cinzel,serif}</style></head><body><header class="bg-white border-b border-stone-200"><div class="max-w-7xl mx-auto h-20 px-5 flex items-center justify-between"><a href="index.html" class="brand text-2xl tracking-widest font-bold">BHAV<span class="text-amber-600">DROP</span></a><a href="checkout.html" class="text-xs uppercase tracking-widest">Bag</a></div></header><main class="max-w-7xl mx-auto px-5 py-10"><h1 class="brand text-3xl">Your wishlist</h1><p class="text-sm text-stone-500 mt-2">Saved in this browser on this device.</p><div id="wishlist-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-7">Loading…</div></main><script src="data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://yrfjqpzqmhddlxbwmsgb.supabase.co','sb_publishable_so1k3P8YeQNeydSvFF9PpQ_vscf0rz9');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let ids=[];try{ids=JSON.parse(localStorage.getItem('bhavdrop_wishlist')||'[]').map(String)}catch{}const root=document.getElementById('wishlist-grid');if(!ids.length){root.innerHTML='<p class="col-span-full py-16 text-center text-stone-500">Your wishlist is empty. <a href="collection.html" class="underline">Explore products</a>.</p>';return}const {data,error}=await db.from('products').select('*').in('id',ids);if(error){root.textContent='Could not load wishlist. Please refresh.';return}const items=(data||[]).filter(p=>p.is_active!==false&&(p.stock_quantity==null||Number(p.stock_quantity)>0));root.innerHTML=items.length?items.map(p=>`<article class="bg-white border border-stone-200 rounded-xl overflow-hidden"><a href="product.html?id=${encodeURIComponent(p.id)}"><img class="w-full aspect-[3/4] object-cover" src="${esc((p.images||[])[0]||p.image||'')}" alt="${esc(p.title)}"></a><div class="p-3"><a class="font-semibold text-sm" href="product.html?id=${encodeURIComponent(p.id)}">${esc(p.title)}</a><p class="mt-2 font-bold">₹${Number(p.price).toLocaleString('en-IN')}</p><button data-add="${esc(p.id)}" class="mt-3 w-full rounded-full bg-black text-white py-2 text-xs">Add to bag</button><button data-remove="${esc(p.id)}" class="mt-2 w-full border rounded-full py-2 text-xs">Remove</button></div></article>`).join(''):'<p class="col-span-full text-stone-500">Saved items are no longer available.</p>';root.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=items.find(x=>String(x.id)===b.dataset.add);if(p)addToCart(p)});root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{localStorage.setItem('bhavdrop_wishlist',JSON.stringify(ids.filter(x=>x!==b.dataset.remove)));load()})}load()</script><script src="analytics.js"></script><script src="support-widget.js"></script><script src="mobile-nav.js"></script>
</body></html>
