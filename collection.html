<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog | BHAVDROP Private Atelier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #faf8f5; color: #1a1a1a; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-40 bg-[#faf8f5]/90 backdrop-blur-md border-b border-[#e8e2d5] h-20 flex items-center justify-between px-6 max-w-7xl mx-auto w-full">
    <a href="index.html" class="font-cinzel text-2xl font-bold tracking-widest">BHAV<span class="text-[#c5a059]">DROP</span></a>
    <div class="flex items-center gap-6 text-xs uppercase tracking-widest font-semibold text-[#5a5345]">
      <a href="vault.html" class="text-rose-700 font-bold">Live Vault</a>
      <a href="checkout.html" class="relative">
        Bag (<span class="cart-badge-count font-mono-num">0</span>)
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-12 flex-grow w-full">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end pb-8 border-b border-[#e8e2d5] gap-4">
      <div>
        <span class="text-[10px] font-mono-num uppercase tracking-[0.2em] text-[#8c8270]">Ready-to-Wear & High Craft</span>
        <h1 class="font-cinzel text-3xl font-bold mt-1">THE COMPLETE ARCHIVE</h1>
      </div>
      <div class="flex gap-2">
        <button onclick="setFilter('all')" class="cat-btn px-4 py-2 rounded-full border border-[#ded7c8] bg-black text-white text-xs uppercase tracking-wider">All</button>
        <button onclick="setFilter('her')" class="cat-btn px-4 py-2 rounded-full border border-[#ded7c8] bg-white text-xs uppercase tracking-wider">Her Desire</button>
        <button onclick="setFilter('him')" class="cat-btn px-4 py-2 rounded-full border border-[#ded7c8] bg-white text-xs uppercase tracking-wider">His Allure</button>
        <button onclick="setFilter('jewels')" class="cat-btn px-4 py-2 rounded-full border border-[#ded7c8] bg-white text-xs uppercase tracking-wider">Heirlooms</button>
      </div>
    </div>

    <div class="col-span-full grid sm:grid-cols-2 gap-3 mb-4"><input id="collection-search" type="search" placeholder="Search products…" class="w-full rounded-full border border-stone-300 bg-white px-4 py-3 text-sm"><select id="collection-sort" class="rounded-full border border-stone-300 bg-white px-4 py-3 text-sm"><option value="newest">Newest</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option></select></div>
<div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-10">
      <!-- Injected by Supabase -->
    </div>
  </main>

  <script src="data.js"></script>
  <script type="module">
    import { supabase } from './supabase.js';

    let allItems = [];
    let activeFilter = 'all';

    async function loadCatalog() {
      const { data, error } = await supabase.from('products').select('*');
      allItems = (!error && data && data.length) ? data.filter(p => p.is_active !== false && (p.stock_quantity == null || Number(p.stock_quantity) > 0)) : [];
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById('catalog-grid');
      let filtered = activeFilter === 'all' ? [...allItems] : allItems.filter(i => i.category === activeFilter); const q=(document.getElementById('collection-search')?.value||'').trim().toLowerCase(); filtered=filtered.filter(i=>[i.title,i.subtitle,i.description,i.category,i.badge].filter(Boolean).join(' ').toLowerCase().includes(q)); const sort=document.getElementById('collection-sort')?.value; if(sort==='price-low')filtered.sort((a,b)=>Number(a.price)-Number(b.price));else if(sort==='price-high')filtered.sort((a,b)=>Number(b.price)-Number(a.price));else filtered.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full py-16 text-center text-xs text-stone-500">No items available in this category.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="bg-white border border-[#e8e2d5] rounded-3xl overflow-hidden hover:border-[#c5a059] transition-all hover:shadow-xl flex flex-col group">
          <a href="product.html?id=${item.id}" class="aspect-[4/5] bg-stone-100 overflow-hidden block">
            <img src="${(Array.isArray(item.images) && item.images[0]) || item.image || ''}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
          </a>
          <div class="p-6 flex flex-col flex-grow justify-between space-y-4">
            <div>
              <span class="text-[10px] font-mono-num uppercase tracking-widest text-[#8c8270]">${item.category}</span>
              <a href="product.html?id=${item.id}">
                <h3 class="font-cinzel text-base font-bold text-stone-900 mt-1 hover:text-[#c5a059]">${item.title}</h3>
              </a>
              <p class="text-xs text-stone-500 mt-1 line-clamp-2">${item.subtitle || item.description || ''}</p>
            </div>
            <div class="pt-2 border-t border-stone-100 flex items-center justify-between">
              <span class="font-mono-num font-bold text-stone-900">₹${Number(item.price).toLocaleString('en-IN')}</span>
              <button data-product="${encodeURIComponent(JSON.stringify(item))}" onclick="addToCart(JSON.parse(decodeURIComponent(this.dataset.product)))" class="px-4 py-2 bg-stone-900 hover:bg-[#c5a059] text-white rounded-xl text-xs font-cinzel font-bold tracking-wider uppercase transition">
                Add To Bag
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.setFilter = (cat) => {
      activeFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        const active = b.getAttribute('onclick') === `setFilter('${cat}')`;
        b.className = active
          ? 'cat-btn px-4 py-2 rounded-full border border-[#ded7c8] bg-black text-white text-xs uppercase tracking-wider'
          : 'cat-btn px-4 py-2 rounded-full border border-[#ded7c8] bg-white text-xs uppercase tracking-wider';
      });
      renderItems();
    };

    document.getElementById('collection-search')?.addEventListener('input',renderItems); document.getElementById('collection-sort')?.addEventListener('change',renderItems);
    loadCatalog();
  </script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="site-control.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="analytics.js"></script><script src="support-widget.js"></script>
<script src="mobile-nav.js"></script>
</body>
</html>
