<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supabase Connectivity & Permission Auditor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0c10] text-zinc-100 p-8 font-mono text-xs">
  <div class="max-w-3xl mx-auto space-y-6">
    <div class="border-b border-zinc-800 pb-4">
      <h1 class="text-xl font-bold text-amber-400">BHAVDROP SUPABASE HEALTH AUDIT</h1>
      <p class="text-zinc-500 mt-1">Direct verification of connection, RLS policies, tables, and RPC functions.</p>
    </div>

    <div class="flex gap-3">
      <button onclick="runAudit()" class="px-5 py-2.5 bg-amber-400 hover:bg-amber-300 text-black font-bold uppercase rounded-lg">
        Run Complete System Diagnostic
      </button>
      <button onclick="clearConsole()" class="px-4 py-2.5 bg-zinc-800 text-zinc-300 rounded-lg">
        Clear Output
      </button>
    </div>

    <div id="status-card" class="p-4 rounded-xl border border-zinc-800 bg-zinc-950 space-y-2">
      <div class="text-zinc-400">Diagnostic Status: <span id="overall-status" class="text-amber-400 font-bold">READY TO TEST</span></div>
    </div>

    <div class="p-4 rounded-xl border border-zinc-800 bg-black overflow-x-auto min-h-[350px]" id="logs">
      <!-- Live logs print here -->
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    function log(msg, type = 'info') {
      const el = document.getElementById('logs');
      const time = new Date().toLocaleTimeString();
      let color = 'text-zinc-400';
      if (type === 'success') color = 'text-emerald-400 font-bold';
      if (type === 'error') color = 'text-rose-400 font-bold';
      if (type === 'warn') color = 'text-amber-400 font-bold';
      el.innerHTML += `<div class="${color} py-0.5">[${time}] ${msg}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    window.clearConsole = () => {
      document.getElementById('logs').innerHTML = '';
      document.getElementById('overall-status').innerText = 'READY';
      document.getElementById('overall-status').className = 'text-amber-400 font-bold';
    };

    window.runAudit = async () => {
      window.clearConsole();
      const statusEl = document.getElementById('overall-status');
      statusEl.innerText = 'TESTING...';
      statusEl.className = 'text-blue-400 font-bold';

      log('STEP 1: Checking supabase.js initialization...');
      if (!supabase) {
        log('FAILED: Supabase client is undefined. Check supabase.js import.', 'error');
        statusEl.innerText = 'FAILED: CLIENT INITIALIZATION';
        statusEl.className = 'text-rose-400 font-bold';
        return;
      }
      log('PASSED: Supabase client loaded into browser.', 'success');

      // Test 1: Check Database Ping
      log('\nSTEP 2: Testing database network ping & public.products table...');
      try {
        const { data: prods, error: pErr } = await supabase.from('products').select('*').limit(2);
        if (pErr) {
          log(`FAILED: Could not read 'products' table. Reason: ${pErr.message} (Code: ${pErr.code})`, 'error');
          if (pErr.code === '42P01') log('HINT: Table does not exist in public schema.', 'warn');
          if (pErr.code === '42501') log('HINT: RLS permission denied. Public SELECT policy is missing.', 'warn');
        } else {
          log(`PASSED: Read from 'products' successfully. Found ${prods.length} rows.`, 'success');
        }
      } catch (err) {
        log(`CRITICAL NETWORK/CORS ERROR: ${err.message}`, 'error');
        statusEl.innerText = 'FAILED: NETWORK / CREDENTIALS';
        statusEl.className = 'text-rose-400 font-bold';
        return;
      }

      // Test 2: Check admin_config table
      log('\nSTEP 3: Checking admin_config table...');
      const { data: cfg, error: cErr } = await supabase.from('admin_config').select('*').limit(1);
      if (cErr) {
        log(`FAILED: Cannot query 'admin_config'. Reason: ${cErr.message} (Code: ${cErr.code})`, 'error');
      } else {
        log(`PASSED: 'admin_config' exists. Retrieved ${cfg.length} row(s).`, 'success');
      }

      // Test 3: Test Password Function RPC (verify_admin_pin)
      log('\nSTEP 4: Testing RPC function "verify_admin_pin" with PIN "bhav2026"...');
      const { data: vRes, error: vErr } = await supabase.rpc('verify_admin_pin', { input_pin: 'bhav2026' });
      if (vErr) {
        log(`FAILED: Calling verify_admin_pin failed. Reason: ${vErr.message} (Code: ${vErr.code})`, 'error');
        log('HINT: Function does not exist or lacks execute grant for anon role.', 'warn');
      } else {
        log(`PASSED: RPC executed. Result returned: ${vRes}`, vRes ? 'success' : 'warn');
        if (!vRes) log('NOTE: Result is FALSE. The PIN in the database does not match "bhav2026".', 'warn');
      }

      // Test 4: Check Test Product Insert
      log('\nSTEP 5: Testing product INSERT permission (admin publishing test)...');
      const testId = 'test-' + Date.now();
      const { data: insData, error: insErr } = await supabase.from('products').insert([{
        id: testId,
        title: 'Diagnostic Test Item',
        category: 'her',
        price: 999,
        images: ['https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400'],
        description: 'Auto-generated by test.html'
      }]).select();

      if (insErr) {
        log(`FAILED: Cannot insert into 'products'. Reason: ${insErr.message} (Code: ${insErr.code})`, 'error');
        if (insErr.code === '42501') log('HINT: RLS policy blocked the INSERT.', 'warn');
      } else {
        log(`PASSED: Successfully inserted test product with ID "${testId}".`, 'success');

        // Cleanup test product
        const { error: delErr } = await supabase.from('products').delete().eq('id', testId);
        if (delErr) {
          log(`WARN: Cleanup delete failed: ${delErr.message}`, 'warn');
        } else {
          log(`PASSED: Successfully deleted diagnostic test item (DELETE works).`, 'success');
        }
      }

      // Test 5: Check public.orders table
      log('\nSTEP 6: Checking "orders" table access...');
      const { data: orders, error: oErr } = await supabase.from('orders').select('*').limit(5);
      if (oErr) {
        log(`FAILED: Cannot query 'orders'. Reason: ${oErr.message}`, 'error');
      } else {
        log(`PASSED: Query on 'orders' succeeded. Found ${orders.length} orders.`, 'success');
      }

      // Test 6: Check public.auctions table
      log('\nSTEP 7: Checking "auctions" table access...');
      const { data: auc, error: aErr } = await supabase.from('auctions').select('*').limit(1);
      if (aErr) {
        log(`FAILED: Cannot query 'auctions'. Reason: ${aErr.message}`, 'error');
      } else {
        log(`PASSED: 'auctions' accessible. Active auction lot: "${auc[0]?.title || 'None'}"`, 'success');
      }

      statusEl.innerText = 'AUDIT COMPLETE - CHECK LOGS ABOVE';
      statusEl.className = 'text-emerald-400 font-bold';
    };
  </script>
</body>
</html>
